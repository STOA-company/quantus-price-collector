name: 'deploy'
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'infrascript/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'deploy.sh'
      - 'nginx.conf'
      - 'redis.conf'
      - 'README.md'

    branches:
      - 'main'
jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment start - ${{ github.repository }}-${{ github.ref_name }}
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: ":rocket: Notify deployment start - ${{ github.repository }}-${{ github.ref_name }}",
              attachments: [{
                color: "warning",
                fields: [{
                  title: "환경",
                  value: "${{ github.event.inputs.environment || 'production' }}",
                  short: true
                }, {
                  title: "브랜치",
                  value: "${{ github.ref_name }}",
                  short: true
                }, {
                  title: "시작자",
                  value: "${{ github.actor }}",
                  short: true
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}
  makeTagAndRelease:
    needs: [notify-start]
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Tag
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false
  buildImageAndPush:
    name: 도커 이미지 빌드와 푸시
    needs: makeTagAndRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v2
      - name: 레지스트리 로그인
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"
      - name: .env 파일 생성
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          echo "$ENV_CONTENT" > .env
      - name: 빌드 앤 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/quantus-price-collector:${{ needs.makeTagAndRelease.outputs.tag_name }}
            ghcr.io/${{ env.OWNER_LC }}/quantus-price-collector:latest
  deploy:
    runs-on: ubuntu-latest
    # 🚨 makeTagAndRelease 가 needs 에 없어서 아래 tag_name 이 빈 문자열이었다.
    #    빈 값이면 deploy.sh 가 latest 로 떨어져 «무엇이 배포됐는지» 를 알 수 없다.
    needs: [ buildImageAndPush, makeTagAndRelease ]
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH to Azure server
        uses: appleboy/ssh-action@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_ACTOR
          script: |
            set -euo pipefail
            sudo mkdir -p /dockerProjects/quantus-price-collector
            cd /dockerProjects/quantus-price-collector

            # 설정 파일들 다운로드.
            # 🚨 토큰을 명령줄에 두지 않는다(서버 프로세스 목록에 보인다). -fsS 로 실패는 소리나게.
            for f in docker-compose.yml deploy.sh nginx.conf sentinel.conf; do
              printf '%s\n' "Authorization: token $GH_TOKEN" \
                | sudo curl -fsS -H @- -o "$f" \
                  "https://raw.githubusercontent.com/${{ github.repository }}/main/$f"
            done
            printf '%s\n' "Authorization: token $GH_TOKEN" \
              | sudo curl -fsS -H @- -o redis.conf \
                "https://raw.githubusercontent.com/${{ github.repository }}/main/redis-master.conf"
            printf '%s\n' "Authorization: token $GH_TOKEN" \
              | sudo curl -fsS -H @- -o redis-slave.conf \
                "https://raw.githubusercontent.com/${{ github.repository }}/main/redis-slave.conf"

            # 실행 권한 부여
            sudo chmod +x deploy.sh

            # 소문자 변환
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            TAG="${{ needs.makeTagAndRelease.outputs.tag_name }}"

            # 🚨 GHCR 인증. 이게 없어서 2026-08-28 배포가 `denied` 로 죽었다.
            #    서버의 docker login 은 만료된다 — 배포 때마다 다시 한다.
            printf '%s' "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # 블루-그린 배포 실행
            sudo GITHUB_REPOSITORY_OWNER=${OWNER_LC} IMAGE_TAG=${TAG} ./deploy.sh ${TAG}

            # 🚨 «배포 성공» 은 스크립트가 끝난 것이 아니라 «방금 받은 이미지가 돌고 있는» 것이다.
            ACTIVE=$(sudo docker ps --filter "name=pricecollector-" --filter "status=running" \
              --format "{{.Names}}" | grep -E "(blue|green)" | head -1)
            if [ -z "${ACTIVE}" ]; then
              echo "배포 후 실행 중인 수집기 컨테이너가 없다"
              exit 1
            fi
            LATEST_IMAGE_ID=$(sudo docker image inspect \
              ghcr.io/${OWNER_LC}/quantus-price-collector:${TAG} --format '{{.Id}}')
            DEPLOYED_IMAGE_ID=$(sudo docker inspect "${ACTIVE}" --format '{{.Image}}')
            if [ "${DEPLOYED_IMAGE_ID}" != "${LATEST_IMAGE_ID}" ]; then
              echo "배포된 컨테이너가 방금 받은 이미지가 아니다: ${ACTIVE}"
              exit 1
            fi
            echo "반영 확인: ${ACTIVE} = ${TAG}"
  notify-success:
    runs-on: ubuntu-latest
    needs: [ makeTagAndRelease, deploy ]
    if: success()
    steps:
      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: ":white_check_mark: Deployment success - ${{ github.repository }}-${{ github.ref_name }}",
              attachments: [{
                color: "good",
                fields: [{
                  title: "환경",
                  value: "${{ github.event.inputs.environment || 'production' }}",
                  short: true
                }, {
                  title: "태그",
                  value: "${{ needs.makeTagAndRelease.outputs.tag_name }}",
                  short: true
                }, {
                  title: "브랜치",
                  value: "${{ github.ref_name }}",
                  short: true
                }, {
                  title: "배포자",
                  value: "${{ github.actor }}",
                  short: true
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [ deploy ]
    if: failure()
    steps:
      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: ":x: Deployment failure - ${{ github.repository }}-${{ github.ref_name }}",
              attachments: [{
                color: "danger",
                fields: [{
                  title: "환경",
                  value: "${{ github.event.inputs.environment || 'production' }}",
                  short: true
                }, {
                  title: "브랜치",
                  value: "${{ github.ref_name }}",
                  short: true
                }, {
                  title: "로그 확인",
                  value: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>",
                  short: false
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}